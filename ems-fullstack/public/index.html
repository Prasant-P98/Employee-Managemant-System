<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Employee Management System (EMS)</span>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      
      <!-- Left Column: Quick Actions -->
      <div class="col-md-5">
        
        <!-- Add Employee Form -->
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white font-weight-bold">Add New Employee</div>
          <div class="card-body">
            <form id="addEmpForm">
              <div class="row g-2 mb-2">
                <div class="col"><input type="text" id="first_name" class="form-control" placeholder="First Name" required></div>
                <div class="col"><input type="text" id="last_name" class="form-control" placeholder="Last Name" required></div>
              </div>
              <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
              <input type="text" id="phone" class="form-control mb-2" placeholder="Phone Number">
              <div class="row g-2 mb-2">
                <div class="col"><input type="date" id="hire_date" class="form-control" required></div>
                <div class="col"><input type="text" id="designation" class="form-control" placeholder="Designation" required></div>
              </div>
            <!--  NEW CORRECTED CODE WITH DROPDOWNS -->
            <div class="row g-2 mb-2">
             <!-- Department Dropdown Menu -->
                <div class="col">
                    <select id="dept_id" class="form-select" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="1">Human Resources</option>
                    <option value="2">Engineering</option>
                    <option value="3">Finance</option>
                    </select>
                </div>

                <!-- User Role Dropdown Menu -->
                <div class="col">
                    <select id="role_id" class="form-select" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="1">Administrator</option>
                    <option value="2">Manager</option>
                    <option value="3">Staff</option>
                    </select>
                </div>
                </div>

              <input type="number" step="0.01" id="salary" class="form-control mb-2" placeholder="Base Salary" required>
              <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
              <button type="submit" class="btn btn-primary w-100">Add Employee</button>
            </form>
          </div>
        </div>

        <!-- Attendance & Payroll Actions -->
        <div class="card shadow-sm">
          <div class="card-header bg-white font-weight-bold">Daily Operations</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Clock In / Clock Out</label>
              <div class="input-group">
                <input type="number" id="clockEmpId" class="form-control" placeholder="Employee ID">
                <button onclick="clockIn()" class="btn btn-success">Clock In</button>
                <button onclick="clockOut()" class="btn btn-warning">Clock Out</button>
              </div>
            </div>
            <hr>
            <div>
              <label class="form-label">Generate Payroll</label>
              <div class="row g-2">
                <div class="col"><input type="number" id="payMonth" class="form-control" placeholder="Month (1-12)"></div>
                <div class="col"><input type="number" id="payYear" class="form-control" placeholder="Year (2026)"></div>
                <div class="col-12"><button onclick="generatePayroll()" class="btn btn-danger w-100 mt-2">Process Payroll</button></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Right Column: Live Reports -->
      <div class="col-md-7">
        
        <!-- Monthly Payslips View Table -->
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span>Generated Payslips</span>
            <button onclick="loadPayslips()" class="btn btn-sm btn-outline-primary">Refresh</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped mb-0">
                <thead>
                  <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Period</th>
                    <th>Base</th>
                    <th>OT</th>
                    <th>Net Salary</th>
                  </tr>
                </thead>
                <tbody id="payslipsTable">
                  <tr><td colspan="6" class="text-center">Click Refresh to load...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Attendance Overview View Table -->
        <div class="card shadow-sm">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span>Attendance Summary</span>
            <button onclick="loadAttendance()" class="btn btn-sm btn-outline-primary">Refresh</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped mb-0">
                <thead>
                  <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Days Present</th>
                    <th>Total Hours</th>
                    <th>Overtime Hours</th>
                  </tr>
                </thead>
                <tbody id="attendanceTable">
                  <tr><td colspan="5" class="text-center">Click Refresh to load...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
